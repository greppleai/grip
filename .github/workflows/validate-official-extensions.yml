name: Validate official extensions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Test packaging, virtual-module loading and mocked publication
        working-directory: packages/coding-agent
        run: node ../../node_modules/vitest/dist/cli.js --run test/official-contracts.test.ts test/official-packaging.test.ts test/official-planner-artifact.test.ts test/official-planner-lifecycle.test.ts
      - name: Test Planner behavior
        run: node node_modules/vitest/dist/cli.js --run --config extensions/planner/vitest.config.mjs
      - name: Validate source versions and published catalog consistency
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/official-extensions-cli.mjs validate-published --out /tmp/grip-official-validation --base "$BASE_REF"