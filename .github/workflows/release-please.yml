name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
      prs: ${{ steps.release.outputs.prs }}
      cli_release_created: ${{ steps.release.outputs['packages/coding-agent--release_created'] }}
      cli_version: ${{ steps.release.outputs['packages/coding-agent--version'] }}
      cli_tag: ${{ steps.release.outputs['packages/coding-agent--tag_name'] }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  sync-release-pr:
    needs: release-please
    if: ${{ needs.release-please.outputs.prs_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve release PR branch
        id: branch
        env:
          RELEASE_PR: ${{ needs.release-please.outputs.pr }}
          RELEASE_PRS: ${{ needs.release-please.outputs.prs }}
        run: |
          BRANCH=$(node -e '
            const prs = process.env.RELEASE_PRS ? JSON.parse(process.env.RELEASE_PRS) : [];
            const pr = process.env.RELEASE_PR ? JSON.parse(process.env.RELEASE_PR) : prs[0];
            if (!pr) throw new Error("release-please did not return PR metadata");
            const branch = pr.headBranchName || pr.headRefName || pr.head_branch_name || pr.head?.ref;
            if (!branch) throw new Error(`Can not resolve release PR branch from ${JSON.stringify(pr)}`);
            console.log(branch);
          ')
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Checkout release PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.branch.outputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Sync generated release files
        run: |
          VERSION=$(node -e 'const manifest=require("./.release-please-manifest.json"); const versions=[...new Set(Object.values(manifest))]; if (versions.length !== 1) throw new Error(`Release Please manifest versions are out of sync: ${versions.join(", ")}`); console.log(versions[0]);')
          node scripts/sync-versions.js --set "$VERSION"
          npm install --package-lock-only --ignore-scripts
          node scripts/generate-coding-agent-shrinkwrap.mjs
          node scripts/generate-coding-agent-install-lock.mjs

      - name: Commit generated release files
        run: |
          if git diff --quiet; then
            echo "Generated release files are already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json packages/*/package.json packages/coding-agent/examples/extensions/*/package.json packages/coding-agent/npm-shrinkwrap.json packages/coding-agent/install-lock/package.json packages/coding-agent/install-lock/package-lock.json
          git commit -m "chore(release): sync generated release files"
          git push origin HEAD:${{ steps.branch.outputs.branch }}

  publish-binary:
    needs: release-please
    if: ${{ needs.release-please.outputs.cli_release_created == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/build-binaries.yml
    with:
      tag: ${{ format('v{0}', needs.release-please.outputs.cli_version) }}
      source_ref: ${{ needs.release-please.outputs.cli_tag }}

  publish-npm:
    needs: [release-please, publish-binary]
    if: ${{ needs.release-please.outputs.cli_release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.release-please.outputs.cli_version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.release-please.outputs.cli_tag }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify release package versions
        run: |
          for package in packages/tui packages/ai packages/agent packages/coding-agent; do
            version=$(node -p "require('./$package/package.json').version")
            if [ "$version" != "$RELEASE_VERSION" ]; then
              echo "$package version $version does not match release $RELEASE_VERSION" >&2
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build npm packages
        run: npm run build

      - name: Check npm packages
        run: npm run check

      - name: Install npm CLI with trusted publishing support
        run: npm install --global npm@11.6.4 --ignore-scripts

      - name: Publish npm packages
        run: |
          publish_tag=latest
          if [[ "$RELEASE_VERSION" == *-* ]]; then publish_tag=next; fi
          # The packages were built and checked above; do not rerun publish lifecycle scripts.
          for package in packages/tui packages/ai packages/agent packages/coding-agent; do
            npm publish --workspace "$package" --access public --provenance --ignore-scripts --tag "$publish_tag"
          done
