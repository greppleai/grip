name: Publish official extension

on:
  push:
    tags: ['extension-*-v*']

# A shared mutable catalog requires serialization across ALL extension IDs.
concurrency:
  group: publish-official-catalog-v1
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - working-directory: packages/coding-agent
        run: node ../../node_modules/vitest/dist/cli.js --run test/official-contracts.test.ts test/official-packaging.test.ts test/official-planner-artifact.test.ts test/official-planner-lifecycle.test.ts
      - name: Test Planner behavior
        run: node node_modules/vitest/dist/cli.js --run --config extensions/planner/vitest.config.mjs
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate tag and publish immutable artifact before catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^extension-([a-z][a-z0-9-]*)-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          node scripts/official-extensions-cli.mjs publish --id "${BASH_REMATCH[1]}"