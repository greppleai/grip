name: Publish official extension

on:
  push:
    branches: [main]
    tags: ['extension-*-v*']
  workflow_dispatch:

# Main and tag publications share the mutable catalog, including partial retries.
concurrency:
  group: publish-official-catalog-v1
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'greppleai/grip'
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Queued main runs validate the latest main, not a superseded push.
          ref: ${{ github.ref == 'refs/heads/main' && 'main' || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - working-directory: packages/coding-agent
        run: node ../../node_modules/vitest/dist/cli.js --run test/official-contracts.test.ts test/official-packaging.test.ts test/official-automatic-publication.test.ts test/official-planner-artifact.test.ts test/official-planner-lifecycle.test.ts
      - name: Test Planner behavior
        run: node node_modules/vitest/dist/cli.js --run --config extensions/planner/vitest.config.mjs
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          # The automatic publisher pushes a version commit and immutable tags atomically.
          persist-credentials: true
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Automatically version and publish changed extensions
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/official-extensions-cli.mjs publish-main
      - name: Validate tag and publish immutable artifact before catalog
        if: startsWith(github.ref, 'refs/tags/extension-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^extension-([a-z][a-z0-9-]*)-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          node scripts/official-extensions-cli.mjs publish --id "${BASH_REMATCH[1]}"
